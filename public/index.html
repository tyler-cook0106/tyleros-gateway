<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>TylerOS</title>
  <link rel="icon" type="image/svg+xml" href="/TylerOS.svg">
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <main class="auth-card">
    <img class="brand-icon" src="/TylerOS White.svg" alt="TylerOS">

    <div class="wordmark">TylerOS</div>

    <div class="connection">
      <div class="spinner" id="spinner"></div>

      <h1 id="title">Connecting to DMZ</h1>

      <p id="status" class="status">
        Establishing secure connection...
      </p>

      <div id="error" class="error-panel" hidden>
        <div class="error-code" id="errorCode"></div>
        <div class="error-message" id="errorMessage"></div>
      </div>

      <button id="retryButton" hidden onclick="window.location.reload()">
        Retry connection
      </button>
    </div>
  </main>

  <script src="/gateway.js"></script>
</body>
</html>
